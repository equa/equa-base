name: Release

on:
  push:
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write
  packages: write

jobs:
  # ── Lint ──────────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Markdown lint
        run: npx markdownlint-cli2 "*.md"

      - name: Spell check
        run: npx cspell --no-progress "*.md"

  # ── Build, test, then push image ─────────────────────────────────────────
  build_image:
    name: Build image
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Log in to GHCR
        if: github.ref == 'refs/heads/beta' || github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Four tiers from one multi-stage Dockerfile. Each build targets a stage;
      # separate buildx cache scopes let higher tiers reuse lower layers without
      # the builds clobbering each other's cache.
      - name: Build T1 equa-base-ci (local only — not pushed yet)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: .devcontainer/Dockerfile
          target: t1-ci
          push: false
          load: true
          tags: equa-base-ci:candidate
          cache-from: type=gha,scope=t1
          cache-to: type=gha,mode=max,scope=t1
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build T2 equa-base-lite (local only — not pushed yet)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: .devcontainer/Dockerfile
          target: t2-lite
          push: false
          load: true
          tags: equa-base-lite:candidate
          cache-from: |
            type=gha,scope=t2
            type=gha,scope=t1
          cache-to: type=gha,mode=max,scope=t2
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build T3 equa-base (local only — not pushed yet)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: .devcontainer/Dockerfile
          target: t3-base
          push: false
          load: true
          tags: equa-base:candidate
          cache-from: |
            type=gha,scope=t3
            type=gha,scope=t2
            type=gha,scope=t1
          cache-to: type=gha,mode=max,scope=t3
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build T4 equa-base-dev (local only — not pushed yet)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: .devcontainer/Dockerfile
          target: t4-dev
          push: false
          load: true
          tags: equa-base-dev:candidate
          cache-from: |
            type=gha,scope=t4
            type=gha,scope=t3
            type=gha,scope=t2
            type=gha,scope=t1
          cache-to: type=gha,mode=max,scope=t4
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run tier smoke tests
        run: |
          docker run --rm equa-base-ci:candidate   bash /tmp/run-all-ci.sh
          docker run --rm equa-base-lite:candidate bash /tmp/run-all-lite.sh
          docker run --rm equa-base:candidate      bash /tmp/run-all.sh
          docker run --rm equa-base-dev:candidate  bash /tmp/run-all-dev.sh

      - name: Run Trivy vulnerability scan (T1 equa-base-ci)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: equa-base-ci:candidate
          format: cyclonedx
          output: sbom-ci.cdx.json
          exit-code: "0"
          scan-type: image

      - name: Run Trivy vulnerability scan (T2 equa-base-lite)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: equa-base-lite:candidate
          format: cyclonedx
          output: sbom-lite.cdx.json
          exit-code: "0"
          scan-type: image

      - name: Run Trivy vulnerability scan (T3 equa-base)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: equa-base:candidate
          format: cyclonedx
          output: sbom.cdx.json
          exit-code: "0"
          scan-type: image

      - name: Run Trivy vulnerability scan (T4 equa-base-dev)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: equa-base-dev:candidate
          format: cyclonedx
          output: sbom-dev.cdx.json
          exit-code: "0"
          scan-type: image

      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@v7
        with:
          name: sbom-cyclonedx
          path: |
            sbom-ci.cdx.json
            sbom-lite.cdx.json
            sbom.cdx.json
            sbom-dev.cdx.json

      - name: Push tested images
        if: github.ref == 'refs/heads/beta' || github.ref == 'refs/heads/main'
        run: |
          retry() { for i in {1..3}; do if "$@"; then return 0; fi; if [ $i -lt 3 ]; then sleep 10; fi; done; return 1; }
          for repo in equa-base-ci equa-base-lite equa-base equa-base-dev; do
            docker tag "${repo}:candidate" "ghcr.io/equa/${repo}:beta"
            docker tag "${repo}:candidate" "ghcr.io/equa/${repo}:beta-${{ github.sha }}"
            retry docker push "ghcr.io/equa/${repo}:beta"
            retry docker push "ghcr.io/equa/${repo}:beta-${{ github.sha }}"
          done

  # ── Semantic release + version tag ───────────────────────────────────────
  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [lint, build_image]
    if: github.ref == 'refs/heads/beta' || github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Record current latest tag
        id: prev
        run: |
          git fetch --tags
          echo "tag=$(git tag --sort=-version:refname | grep -E '^v[0-9]' | head -1)" \
            >> "$GITHUB_OUTPUT"

      - name: Semantic release
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag images with release version
        run: |
          retry() { for i in {1..3}; do if "$@"; then return 0; fi; if [ $i -lt 3 ]; then sleep 10; fi; done; return 1; }
          git fetch --tags
          NEW_TAG=$(git tag --sort=-version:refname | grep -E '^v[0-9]' | head -1)
          PREV_TAG="${{ steps.prev.outputs.tag }}"
          if [ -n "$NEW_TAG" ] && [ "$NEW_TAG" != "$PREV_TAG" ]; then
            echo "Tagging images as ${NEW_TAG}"
            echo "${{ secrets.GITHUB_TOKEN }}" \
              | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            for repo in equa-base-ci equa-base-lite equa-base equa-base-dev; do
              retry docker pull "ghcr.io/equa/${repo}:beta-${{ github.sha }}"
              docker tag  "ghcr.io/equa/${repo}:beta-${{ github.sha }}" \
                          "ghcr.io/equa/${repo}:${NEW_TAG}"
              retry docker push "ghcr.io/equa/${repo}:${NEW_TAG}"
            done
          else
            echo "No new release; skipping version tag."
          fi
