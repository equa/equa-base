name: Release

on:
  push:
    branches:
      - beta
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write
  packages: write

jobs:
  # ── Lint ──────────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Markdown lint
        run: npx markdownlint-cli2 "*.md"

      - name: Spell check
        run: npx cspell --no-progress "*.md"

  # ── Build, test, then push image ─────────────────────────────────────────
  build_image:
    name: Build image
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (local only — not pushed yet)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .devcontainer/Dockerfile
          push: false
          load: true
          tags: equa-base:candidate
          cache-from: type=gha
          cache-to: type=gha,mode=max
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run toolchain smoke tests
        run: docker run --rm equa-base:candidate bash /tmp/run-all.sh

      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: equa-base:candidate
          format: cyclonedx
          output: sbom.cdx.json
          exit-code: "0"
          scan-type: image

      - name: Upload SBOM artefact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json

      - name: Push tested image
        run: |
          docker tag equa-base:candidate ghcr.io/equa/equa-base:beta
          docker tag equa-base:candidate ghcr.io/equa/equa-base:beta-${{ github.sha }}
          docker push ghcr.io/equa/equa-base:beta
          docker push ghcr.io/equa/equa-base:beta-${{ github.sha }}

  # ── Semantic release + version tag ───────────────────────────────────────
  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [lint, build_image]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Record current latest tag
        id: prev
        run: |
          git fetch --tags
          echo "tag=$(git tag --sort=-version:refname | grep -E '^v[0-9]' | head -1)" \
            >> "$GITHUB_OUTPUT"

      - name: Semantic release
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag image with release version
        run: |
          git fetch --tags
          NEW_TAG=$(git tag --sort=-version:refname | grep -E '^v[0-9]' | head -1)
          PREV_TAG="${{ steps.prev.outputs.tag }}"
          if [ -n "$NEW_TAG" ] && [ "$NEW_TAG" != "$PREV_TAG" ]; then
            echo "Tagging image as ${NEW_TAG}"
            echo "${{ secrets.GITHUB_TOKEN }}" \
              | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            docker pull "ghcr.io/equa/equa-base:beta-${{ github.sha }}"
            docker tag  "ghcr.io/equa/equa-base:beta-${{ github.sha }}" \
                        "ghcr.io/equa/equa-base:${NEW_TAG}"
            docker push "ghcr.io/equa/equa-base:${NEW_TAG}"
          else
            echo "No new release; skipping version tag."
          fi
